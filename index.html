<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --good: #1f9d55; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e8eaee; --muted: #9aa3b0;
      --border: #2c313a; --good: #3cc47c; --bad: #ef6464;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 8px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .bar {
    display: flex; align-items: center; gap: 8px; max-width: 560px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
  }
  .stat { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .stat .v { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat.small .v { font-size: 20px; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .score.bump { animation: bump .25s ease; }
  .score.shake { animation: shake .3s ease; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  button.vote {
    flex: none; font-size: 24px; line-height: 1; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
    transition: transform .08s ease, border-color .15s ease;
  }
  button.vote:active { transform: scale(.94); }
  button.vote.up:hover { border-color: var(--good); }
  button.vote.down:hover { border-color: var(--bad); }
  .reset { flex: none; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 420px) {
    .bar { gap: 4px; }
    .stat { gap: 3px; }
    .stat .l { font-size: 9px; letter-spacing: .02em; }
    button.vote { padding: 6px 8px; }
  }
</style>
</head>
<body>
<div class="bar">
  <button class="vote down" id="down" aria-label="Wrong answer">👎</button>
  <div class="stat"><span class="l">Score</span><span class="v score" id="score">0</span></div>
  <div class="stat small" title="Saves left this round"><span class="l">Saves</span><span class="v" id="saves">0</span></div>
  <div class="stat small" title="Global saves"><span class="l">Global</span><span class="v" id="global">0</span></div>
  <button class="vote up" id="up" aria-label="Right answer">👍</button>
  <button class="reset" id="reset" aria-label="Reset everything" title="Reset everything">↺</button>
</div>
<div class="sr" id="msg" aria-live="polite"></div>

<script>
  const KEY = 'score-tracker-v1';
  const fresh = () => ({ score: 0, saves: 0, globalSaves: 0 });

  let state;
  try { state = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { state = fresh(); }

  const $ = id => document.getElementById(id);

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  }

  function render(msg, anim) {
    $('score').textContent = state.score;
    $('saves').textContent = state.saves;
    $('global').textContent = state.globalSaves;
    $('msg').textContent = msg || '';
    if (anim) {
      const el = $('score');
      el.classList.remove('bump', 'shake');
      void el.offsetWidth;
      el.classList.add(anim);
    }
    save();
  }

  function right() {
    state.score += 1;
    render('Correct! +1', 'bump');
  }

  function wrong() {
    // At zero, a wrong answer does nothing: no save spent, no global increment.
    if (state.score === 0) {
      render('Wrong — already at zero.', 'shake');
      return;
    }
    // Use a save if one is available: score holds.
    if (state.saves > 0) {
      state.saves -= 1;
      render(`Saved! Score holds at ${state.score}.`, 'shake');
      return;
    }
    // No saves left: reset score, bump global saves, and start the new round with that many saves.
    state.score = 0;
    state.globalSaves += 1;
    state.saves = state.globalSaves;
    render(`Reset to 0. Next round you get ${state.saves} save${state.saves === 1 ? '' : 's'}.`, 'shake');
  }

  $('up').addEventListener('click', right);
  $('down').addEventListener('click', wrong);
  $('reset').addEventListener('click', () => {
    if (confirm('Reset score, saves and global saves?')) { state = fresh(); render('Everything reset.'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') right();
    if (e.key === 'ArrowDown') wrong();
  });

  render();
</script>
</body>
</html>
